<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALMEER - Music Player</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="music-app">
        <div class="header">
            <div class="logo">
                <h1>ALMEER</h1>
                <p>Music Player & Discovery</p>
            </div>
            <div class="search-container">
                <input type="text" class="search-input" id="searchInput" placeholder="Search for songs, artists, albums...">
                <button class="search-btn" onclick="searchMusic()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="player-section">
                <div class="now-playing-card">
                    <div class="album-art-large" id="albumArt">
                        <i class="fas fa-music"></i>
                    </div>
                    <div class="song-info-large">
                        <div class="song-title-large" id="nowPlayingTitle">No song playing</div>
                        <div class="song-artist-large" id="nowPlayingArtist">Search for music to play</div>
                    </div>
                    <div class="progress-section">
                        <div class="progress-bar" id="progressBar">
                            <div class="progress" id="progress"></div>
                        </div>
                        <div class="time-info">
                            <span id="currentTime">0:00</span>
                            <span id="duration">0:00</span>
                        </div>
                    </div>
                    <div class="player-controls">
                        <button class="control-btn" onclick="prevSong()">
                            <i class="fas fa-backward"></i>
                        </button>
                        <button class="play-btn-large" onclick="togglePlay()">
                            <i class="fas fa-play" id="playIcon"></i>
                        </button>
                        <button class="control-btn" onclick="nextSong()">
                            <i class="fas fa-forward"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="search-results-section">
                <div class="section-title">
                    <i class="fas fa-music"></i>
                    <span>Search Results</span>
                </div>
                <div id="searchResults"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
                  </html>
